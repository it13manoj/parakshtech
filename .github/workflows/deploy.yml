name: Deploy ParakshTech

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Check Server Host
        run: |
          echo "Server host: ${{ vars.SERVER_HOST }}"

          if [ -z "${{ vars.SERVER_HOST }}" ]; then
            echo "ERROR: SERVER_HOST variable is empty"
            exit 1
          fi

          echo "SERVER_HOST is configured successfully"

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            set -e

            echo "Connected to server successfully"

            cd /var/www/parakshtech.com

            echo "Pulling latest code..."
            git pull origin main

            echo "Installing dependencies..."
            npm ci

            echo "Building application..."
            npm run build

            echo "Testing Nginx..."
            sudo nginx -t

            echo "Reloading Nginx..."
            sudo systemctl reload nginx

            echo "Deployment completed successfully!"